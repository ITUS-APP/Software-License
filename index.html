<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software License Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- jQuery (จำเป็นสำหรับ Select2) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <!-- Tabulator -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .page-view { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- ================= หน้า Login ================= -->
    <div id="loginView" class="page-view active-view flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">License Manager</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="loginUser" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-blue-200 focus:outline-none" placeholder="admin">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPass" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-blue-200 focus:outline-none" placeholder="1234">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- ================= หน้า Dashboard หลัก ================= -->
    <div id="mainView" class="page-view min-h-screen">
        <!-- Navbar -->
        <nav class="bg-slate-800 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <span class="font-bold text-xl tracking-wider">SLM System</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="displayUser" class="text-sm bg-slate-700 px-3 py-1 rounded-full"></span>
                        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm transition">ออกจากระบบ</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h3 class="text-xl font-bold text-gray-800">จัดการข้อมูล Software License</h3>
                    <button class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition shadow">+ เพิ่มรายการใหม่</button>
                </div>

                <!-- ส่วนค้นหา (อินพุตและปุ่มอยู่คนละบรรทัด) -->
                <div class="bg-gray-50 p-4 rounded-md border border-gray-200 mb-6">
                    <h4 class="font-semibold text-gray-700 mb-3">ค้นหาข้อมูล</h4>
                    
                    <div class="block w-full mb-3">
                        <input type="text" id="searchInput" class="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-200 focus:outline-none" placeholder="พิมพ์ชื่อซอฟต์แวร์ หรือ License Key เพื่อค้นหา...">
                    </div>
                    
                    <div class="block w-full">
                        <button onclick="triggerSearch()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md transition shadow">
                            <span class="flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                                ค้นหา
                            </span>
                        </button>
                    </div>
                </div>

                <!-- Dropdown โชว์ Select2 -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">ทดสอบระบบเบิกจ่าย (Select2):</label>
                    <select id="softwareSelect" class="w-full md:w-1/2">
                        <option value="">-- เลือกซอฟต์แวร์ --</option>
                        <option value="1">Microsoft Office 365</option>
                        <option value="2">Adobe Creative Cloud</option>
                        <option value="3">AutoCAD 2024</option>
                    </select>
                </div>

                <!-- พื้นที่แสดงตาราง Tabulator -->
                <div id="licenseTable" class="w-full mt-4"></div>
            </div>
        </div>
    </div>

    <!-- ================= Scripts ================= -->
    <script>
        // 🛑 ใส่ Web App URL ที่ได้จาก Google Apps Script ที่นี่
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwi0Ri42a2GY35S_7CnhaFCKgOpk5dtWN9PK4lLHISvvxuCy0EhFq-QveX2uriSPdwo/exec";
        
        let table;

        // สลับหน้าจอ UI
        function switchView(viewId) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        // ฟังก์ชันกลางสำหรับยิง API ผ่าน Fetch
        async function fetchAPI(action, payload) {
            const response = await fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, payload: payload })
            });
            return await response.json();
        }

        // เข้าสู่ระบบ
        async function handleLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (!user || !pass) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');

            Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            try {
                const res = await fetchAPI('login', { username: user, password: pass });
                
                if (res.success) {
                    Swal.close();
                    document.getElementById('displayUser').innerText = `👩‍💻 ${res.user.username} (${res.user.role})`;
                    switchView('mainView');
                    
                    // เรียกการทำงาน Libraries ต่างๆ
                    initSelect2();
                    loadTableData();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', res.message, 'error');
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
        }

        function handleLogout() {
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            switchView('loginView');
        }

        // เริ่มต้น Tabulator
        async function loadTableData() {
            // โหลดข้อมูลแบบจำลองหรือดึงจาก API
            const res = await fetchAPI('getLicenses', {});
            
            // ข้อมูลจำลองกรณีที่ Sheet ยังว่างอยู่
            const demoData = res.data.length > 0 ? res.data : [
                { id: "L01", software: "Microsoft Office 365", key: "XXXX-XXXX-XXXX", vendor: "Microsoft", expiry: "31/12/2026", total: 50, used: 45 },
                { id: "L02", software: "Adobe Creative Cloud", key: "YYYY-YYYY-YYYY", vendor: "Adobe", expiry: "15/10/2026", total: 10, used: 10 },
            ];

            table = new Tabulator("#licenseTable", {
                data: demoData,
                layout: "fitColumns",
                responsiveLayout: "collapse",
                pagination: "local",
                paginationSize: 10,
                columns: [
                    { title: "ID", field: "id", width: 80 },
                    { title: "ชื่อซอฟต์แวร์", field: "software", minWidth: 150 },
                    { title: "License Key", field: "key", minWidth: 150 },
                    { title: "ผู้ผลิต", field: "vendor" },
                    { title: "วันหมดอายุ", field: "expiry", hozAlign: "center" },
                    { 
                        title: "สถานะ (Used/Total)", 
                        formatter: function(cell) {
                            const row = cell.getRow().getData();
                            const color = row.used >= row.total ? "text-red-600 font-bold" : "text-green-600";
                            return `<span class="${color}">${row.used} / ${row.total}</span>`;
                        },
                        hozAlign: "center"
                    }
                ],
            });
        }

        // ค้นหาข้อมูลในตาราง
        function triggerSearch() {
            const keyword = document.getElementById('searchInput').value;
            if (table) {
                table.setFilter([
                    [
                        {field: "software", type: "like", value: keyword},
                        {field: "key", type: "like", value: keyword}
                    ]
                ]);
            }
        }

        // เริ่มต้น Select2
        function initSelect2() {
            $('#softwareSelect').select2({
                placeholder: "พิมพ์เพื่อค้นหาซอฟต์แวร์...",
                allowClear: true
            });
        }
    </script>
</body>
</html>
